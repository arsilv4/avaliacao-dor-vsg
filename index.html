<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Avaliação da Dor VSG</title>
    <style>
      /* O jogo ocupa toda a janela do navegador, em qualquer tamanho de tela. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b1220; outline: none; }
      #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #e8edf5; font: 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
      #carregando h1 { margin: 0; font-size: 26px; font-weight: 600; }
      #barra { width: min(420px, 80vw); height: 10px; border-radius: 5px; background: #24324a; overflow: hidden; }
      #barra div { width: 0; height: 100%; background: #2bb8a6; transition: width .2s; }
      #carregando small { color: #a9b6c8; }
      #aviso { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: none; max-width: 90vw;
        font: 15px system-ui, sans-serif; }
      #aviso div { padding: 10px 14px; border-radius: 6px; margin-bottom: 6px; color: #111; background: #ffd75e; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carregando">
      <h1>Avaliação da Dor VSG</h1>
      <div id="barra"><div></div></div>
      <small>Carregando a simulação… Na primeira vez pode levar um minuto.<br>Clique na página para liberar o som.</small>
    </div>
    <div id="aviso"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function mostrarAviso(msg, tipo) {
        var aviso = document.querySelector("#aviso");
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (tipo == "error") div.style.background = "#ff6b6b";
        aviso.appendChild(div);
        aviso.style.display = "block";
        if (tipo != "error") setTimeout(function () {
          aviso.removeChild(div);
          if (!aviso.children.length) aviso.style.display = "none";
        }, 5000);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Simulação Clínica Virtual",
        productName: "Avaliação da Dor VSG",
        productVersion: "1.0",
        showBanner: mostrarAviso,
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#barra div").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#carregando").style.display = "none";
          canvas.focus();
        }).catch(function (msg) {
          mostrarAviso("Não foi possível carregar a simulação: " + msg, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
